<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Trend Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glassGrad)" />

  <!-- Inner border ring -->
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Data Grid Subtle Lines -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8">
    <line x1="200" y1="360" x2="824" y2="360" />
    <line x1="200" y1="520" x2="824" y2="520" />
    <line x1="200" y1="680" x2="824" y2="680" />
  </g>

  <!-- 3D-like Bars -->
  <!-- Bar 1 (Short) -->
  <rect x="240" y="520" width="120" height="240" rx="24" fill="url(#bar1)" filter="url(#dropShadow)" />
  <!-- Bar 2 (Medium) -->
  <rect x="452" y="380" width="120" height="380" rx="24" fill="url(#bar2)" filter="url(#dropShadow)" />
  <!-- Bar 3 (Tall) -->
  <rect x="664" y="240" width="120" height="520" rx="24" fill="url(#bar3)" filter="url(#dropShadow)" />

  <!-- Upward Trend Line -->
  <path d="M 210 650 Q 380 520, 512 400 T 780 200" fill="none" stroke="url(#lineGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Glowing Spark Peak -->
  <circle cx="780" cy="200" r="22" fill="#ffffff" filter="url(#glow)" />
  <circle cx="780" cy="200" r="14" fill="#f43f5e" />
  <circle cx="780" cy="200" r="6" fill="#ffffff" />

  <!-- Star sparkle -->
  <path d="M 780 160 L 784 190 L 814 194 L 784 198 L 780 228 L 776 198 L 746 194 L 776 190 Z" fill="#ffffff" opacity="0.8" />
</svg>
