[package]
name = "tablesmith"
version = "0.1.0"
description = "桌面数据转换与可视化工具"
authors = ["张凌霄"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.28", features = ["dates"] }
chrono = { version = "0.4", default-features = false }
encoding_rs = "0.8"
quick-xml = "0.37"
zip = { version = "4", default-features = false, features = ["deflate"] }
cfb = "0.14"
codepage = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
